<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- The browser version's page (see MacBuild.BuildWeb): the game fills the whole window, on the menu's dark stage
         (the stage look, owner 2026-10-31: pictures, not words), with a velvet card, a turning gold star and a gold
         bar while it loads. The shop (shop.js, in the website's look) decides which
         download to load: the free one, or every game for a signed-in buyer whose computer is the one playing. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- iPhones and iPads only (computers ignore these): the game also fills the strips beside the notch, and once
         added to the home screen (Share, then "Add to Home Screen") it opens full screen without Safari's bars, the
         only way Apple lets a website fill an iPhone's screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Off the Couch">
    <link rel="apple-touch-icon" href="home-icon.png">
    <meta name="robots" content="noindex"> <!-- a test page for now: kept out of search results -->
    <title>Off the Couch</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="shop.css">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1E1636; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1E1636; outline: none; }
      body::before { content: ""; position: fixed; left: 50%; top: 42%; width: 900px; height: 900px; transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(255, 214, 120, .3), rgba(255, 214, 120, 0)); pointer-events: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(420px, calc(100vw - 64px)); box-sizing: border-box; padding: 26px 28px 26px; text-align: center;
        background: #3A2F5C; border-radius: 30px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
        font: 600 17px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #B9AED8; }
      #loading h1 { margin: 0 0 14px; font: 400 40px/1.1 "Caveat Brush", -apple-system, system-ui, sans-serif; color: #FFC93C; }
      #loading p { margin: 0 0 16px; }
      #loading p:empty { display: none; }
      #star { width: 44px; height: 44px; margin: 0 auto 14px; animation: turn 1.6s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      #bar { height: 14px; border-radius: 7px; background: #4A3E70; overflow: hidden; }
      #bar div { height: 100%; width: 0; background: #FFC93C; border-radius: 7px; transition: width .2s; }
      #chrome { display: none; gap: 20px; justify-content: center; align-items: center; margin-top: 18px; }
      #chrome button { font: inherit; font-weight: 800; color: #2B1D4A; background: #FFC93C; border: 0; border-radius: 22px;
        padding: 10px 20px; cursor: pointer; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); }
      #chrome a { color: #FFC93C; font-weight: 800; }
      #chrome.phone { flex-direction: column; gap: 12px; }
      #chrome.phone #copy { background: none; box-shadow: none; color: #FFC93C; padding: 4px; text-decoration: underline; font-weight: 700; }
      #send { display: none; font: inherit; font-weight: 800; color: #2B1D4A; background: #FFC93C; border: 0;
        border-radius: 22px; padding: 12px 22px; cursor: pointer; }
      /* Phones only (see "phone" below): a moving picture while the phone is held upright — a gold phone turning on
         its side — and the numbers in the corner */
      #turn { display: none; position: fixed; inset: 0; z-index: 20; background: #1E1636; flex-direction: column; gap: 24px; align-items: center; justify-content: center; }
      #turn svg { width: 180px; height: 180px; overflow: visible; }
      #turn .phone { transform-origin: 90px 90px; animation: sideways 3.2s cubic-bezier(.5, 0, .3, 1) infinite; }
      #turn .tick { opacity: 0; animation: tick 3.2s linear infinite; }
      @keyframes sideways { 0%, 25% { transform: rotate(0); } 55%, 90% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
      @keyframes tick { 0%, 52% { opacity: 0; } 60%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
      @media (orientation: portrait) { body.phone #turn { display: flex; } }
      #turn p { margin: 0; padding: 0 24px; color: #FFC93C; text-align: center; font: 400 clamp(32px, 9vw, 52px)/1.15 "Caveat Brush", -apple-system, system-ui, sans-serif; }
      #numbers { display: none; position: fixed; left: 8px; top: 8px; z-index: 10; padding: 4px 8px; border-radius: 4px;
        background: rgba(43, 45, 66, .7); color: #FFFFFF; font: 600 11px/1.35 ui-monospace, Menlo, monospace;
        pointer-events: none; white-space: pre; }
      body.numbers #numbers { display: block; }
      #full { display: none; position: fixed; right: calc(27% + 12px); top: 12px; z-index: 10; width: 44px; height: 44px; padding: 0;
        border: 0; border-radius: 50%; background: #FFC93C; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); align-items: center; justify-content: center; }
      body.phone.can-fill #full { display: flex; }
      /* A first visit (owner's pick 2026-11-02, "the game is already playing"): instead of the card, the paper orchard
         with fruit flying and being sliced from the first second, then one gold button. See "first visit" below. */
      #orchard { display: none; position: fixed; inset: 0; z-index: 5; overflow: hidden; background: #A9C8D6 url(orchard/orchard.webp) center / cover;
        font: 600 17px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; transition: opacity .5s; }
      body.first #orchard { display: block; }
      body.first #loading { display: none; }
      body.first.failed #loading { display: block; z-index: 6; }
      #orchard.lifting { opacity: 0; pointer-events: none; }
      #orchard h1 { position: absolute; left: 0; right: 0; top: 7vh; margin: 0; text-align: center; color: #FFFFFF;
        font: 400 clamp(54px, 10vw, 120px)/1 "Caveat Brush", -apple-system, system-ui, sans-serif;
        -webkit-text-stroke: 4px #2B1D4A; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(43, 29, 74, .35); }
      #orchard .fruit { position: absolute; left: 0; top: 0; height: clamp(90px, 15vh, 160px); pointer-events: none;
        filter: drop-shadow(0 6px 4px rgba(43, 29, 74, .3)); will-change: transform; }
      #orchard .splat { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; pointer-events: none;
        animation: splat .7s ease-out forwards; }
      @keyframes splat { from { transform: scale(.2); opacity: .95; } to { transform: scale(1.4); opacity: 0; } }
      #orchard svg.slash { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
      #orchard svg.slash path { fill: none; stroke: #FFF6C8; stroke-width: 12; stroke-linecap: round; filter: drop-shadow(0 0 8px #FFE27A); }
      #orchard .middle { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); display: flex; flex-direction: column;
        align-items: center; gap: 16px; width: calc(100vw - 32px); opacity: 0; transition: opacity .5s; }
      #orchard.ready .middle { opacity: 1; }
      #play { display: inline-flex; align-items: center; gap: 14px; font: 800 clamp(24px, 3.2vw, 38px)/1.1 -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #2B1D4A; background: #FFC93C; border: 0; border-radius: 999px; padding: 22px 46px; cursor: pointer;
        box-shadow: 0 8px 0 #C9921A, 0 14px 30px rgba(43, 29, 74, .35); animation: breathe 2.2s ease-in-out infinite; }
      #play:active { transform: translateY(4px); box-shadow: 0 4px 0 #C9921A, 0 8px 20px rgba(43, 29, 74, .35); }
      #play[disabled] { animation: none; cursor: default; }
      #play svg { width: 1.1em; height: 1.1em; flex: none; }
      @keyframes breathe { 50% { transform: scale(1.04); } }
      #orchard .line { display: inline-flex; align-items: center; gap: 10px; max-width: 640px; padding: 10px 20px; border-radius: 999px;
        background: rgba(43, 29, 74, .82); color: #FFFFFF; text-align: center; }
      #orchard .line svg { width: 18px; height: 18px; flex: none; }
      #orchard .line.problem { border-radius: 22px; background: #2B1D4A; }
      #orchard #promise { display: none; }
      #orchard #promise.problem { display: inline-flex; }
      /* The promise under the button (owner's pick 2026-11-04, drafts/camera-promise.html, option 1): the game's taped paper. */
      #orchard .note { position: relative; max-width: 640px; padding: 14px 26px; border-radius: 6px; background: #FFFBF3; color: #2B1D4A;
        box-shadow: 6px 8px 0 rgba(43, 29, 74, .28); transform: rotate(-1.2deg); }
      #orchard .note::before { content: ""; position: absolute; left: 50%; top: -13px; width: 96px; height: 26px; margin-left: -48px;
        background: rgba(255, 201, 60, .8); transform: rotate(2deg); }
      #orchard .note b { display: block; margin-bottom: 6px; text-align: center; font: 400 34px/1.1 "Caveat Brush", -apple-system, system-ui, sans-serif; }
      #orchard .note ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin: 0; padding: 0; list-style: none; font-size: 19px; }
      #orchard .note li::before { content: "\2713\00a0"; color: #2E9E5B; font-weight: 900; }
      #orchard .note[hidden] { display: none; }
      @media (max-height: 500px) {
        #orchard .middle { top: 61%; gap: 12px; }
        #play { font-size: 25px; padding: 14px 32px; box-shadow: 0 6px 0 #C9921A; }
        #orchard .note { padding: 8px 16px; }
        #orchard .note::before { top: -9px; width: 70px; height: 18px; margin-left: -35px; }
        #orchard .note b { margin: 0; font-size: 24px; }
        #orchard .note ul { gap: 2px 12px; font-size: 14px; }
      }
      #growing { position: absolute; left: 50%; bottom: 7vh; width: min(360px, 60vw); height: 12px; transform: translateX(-50%);
        border-radius: 6px; background: rgba(43, 29, 74, .55); overflow: hidden; }
      #growing div { height: 100%; width: 0; background: #FFC93C; border-radius: 6px; transition: width .2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Off the Couch</h1>
      <svg id="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 6 6.4.6-4.8 4.3 1.4 6.4L12 16.8 6.2 20.1l1.4-6.4L2.8 9.4l6.4-.6z" fill="#FFC93C"/></svg>
      <p></p>
      <div id="bar"><div></div></div>
      <div id="chrome">
        <button id="send">Send it to myself</button>
        <button id="copy">Copy the link</button>
        <a id="get" href="https://www.google.com/chrome/" target="_blank" rel="noopener">Get Chrome</a>
      </div>
    </div>
    <div id="orchard">
      <h1>Fruit Slicer</h1>
      <div class="middle">
        <button id="play"><svg viewBox="0 0 24 24" fill="none" stroke="#2B1D4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><span>Play with your camera</span></button>
        <div class="note" id="note"><b>Your camera stays yours</b><ul><li>Stays on your device</li><li>Nothing recorded</li><li>Never sent to us</li></ul></div>
        <div class="line" id="promise"><svg viewBox="0 0 24 24" fill="#FFC93C" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.5v11h-13V10zm2.4 0h5.2V7a2.6 2.6 0 0 0-5.2 0z"/></svg><span>Your picture stays on your device. Nothing is recorded.</span></div>
      </div>
      <div id="growing"><div></div></div>
    </div>
    <div id="turn" role="img" aria-label="Turn your device sideways to play">
      <svg viewBox="0 0 180 180" aria-hidden="true">
        <path d="M150 90 A60 60 0 0 0 90 30" fill="none" stroke="#B9AED8" stroke-width="7" stroke-linecap="round"/>
        <path d="M90 18 L76 30 L90 42" fill="none" stroke="#B9AED8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="phone"><rect x="62" y="40" width="56" height="100" rx="12" fill="#2B1D4A" stroke="#FFC93C" stroke-width="7"/>
          <path class="tick" d="M75 90 l10 10 l20 -22" fill="none" stroke="#FFC93C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 90 90)"/></g>
      </svg>
      <p id="turn-words">Turn your phone sideways to play</p>
    </div>
    <div id="numbers"></div>
    <button id="full" aria-label="Full screen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D4A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <script src="shop.js"></script>
    <script>
      var bar = document.querySelector("#bar div");
      // The free game's files come from the online program's storage (see /api/free there, 2026-11-02: the website sent
      // the 45 MB game file at about 50 KB a second). They are uploaded there with each new version. If that fails, the
      // website's own copy in Build/.
      var Files = "https://api.cuzgames.com/api/free/build/";
      var config = {
        arguments: [],
        dataUrl: Files + "d813c73d4902ca2c0cf464aee55aaa3a.data.unityweb",
        frameworkUrl: Files + "92217fa2eb75fd9bc8b7bdc5c3a845a6.framework.js.unityweb",
        codeUrl: Files + "85253e5dc5a8e03b492c2668266962e6.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Yonatan Ohana",
        productName: "Off the Couch",
        productVersion: "1.0.0",
      };
      // For trying how sharp the game is drawn: ?dpr=1 draws one game pixel per screen point (softer, lighter work).
      var sharpness = new URLSearchParams(location.search).get("dpr");
      if (sharpness) config.devicePixelRatio = parseFloat(sharpness);

      // Phones and tablets play too (owner, 2026-10-30). Only there, the game is drawn at most twice as sharp as the
      // screen's points, the screen is kept awake (nothing is touched while playing), a card asks to hold the device
      // sideways, and the rest below. ?numbers shows the reader's numbers in the corner. Computers get none of it.
      var phone = !!((navigator.userAgentData && navigator.userAgentData.mobile) ||
        (navigator.maxTouchPoints > 1 && !matchMedia("(any-pointer: fine)").matches));
      if (phone) {
        document.body.classList.add("phone");
        if (Math.min(screen.width, screen.height) >= 600) document.getElementById("turn-words").textContent = "Turn your tablet sideways to play";
        if (new URLSearchParams(location.search).has("numbers")) document.body.classList.add("numbers");
        if (!sharpness) config.devicePixelRatio = Math.min(window.devicePixelRatio, 2);
        var awake = function () {
          if (navigator.wakeLock && document.visibilityState === "visible")
            navigator.wakeLock.request("screen").catch(function () {});
        };
        awake();
        document.addEventListener("visibilitychange", awake);
        document.addEventListener("touchend", awake, { once: true }); // some phones only allow it after a touch
        // Android phones: any touch, or the "Full screen" button at the top, fills the whole screen, held sideways
        // (browsers only allow it right after a touch). Only once the camera is on: full screen hides the browser's
        // "Allow camera?" box on iPads (owner, 2026-10-30). The button shows while the page is not full screen.
        // iPhones cannot; there full screen comes from adding the page to the home screen (see the head).
        var cameraOn = function () { return !!window.OTCReader && OTCReader.camera === 3; };
        var filling = false, fill = function () {
          var page = document.documentElement;
          if (filling || !cameraOn() || document.fullscreenElement || !page.requestFullscreen) return;
          filling = true;
          page.requestFullscreen({ navigationUI: "hide" }).then(function () {
            if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape");
          }).catch(function () {}).then(function () { filling = false; });
        };
        var showFull = function () {
          document.body.classList.toggle("can-fill", !!document.fullscreenEnabled && !document.fullscreenElement && cameraOn());
        };
        setInterval(showFull, 500);
        document.addEventListener("fullscreenchange", showFull);
        document.getElementById("full").addEventListener("click", fill);
        document.addEventListener("pointerup", fill, true);
        // The game drawn lighter (see TabletTuning.ApplyBrowser in the game); &fullgraphics keeps the computer's drawing.
        if (!new URLSearchParams(location.search).has("fullgraphics")) window.OTCLightDrawing = true;
        // Smaller camera pictures (640x360 instead of 1280x720): each one is copied for the game's picture and for the
        // reader, and on an iPad those copies showed as freezes every few seconds (2026-10-30). The body reader
        // shrinks the picture anyway. &bigcamera keeps the full size, for comparing.
        if (!new URLSearchParams(location.search).has("bigcamera") && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          var openCamera = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
          navigator.mediaDevices.getUserMedia = function (asked) {
            if (asked && asked.video && typeof asked.video === "object")
              asked = { audio: asked.audio, video: Object.assign({}, asked.video, { width: { ideal: 640 }, height: { ideal: 360 } }) };
            return openCamera(asked);
          };
        }
        watchReader();
      }
      // Trying other browsers on a computer (Safari, 2026-10-30): ?numbers shows the reader's numbers there too, and
      // ?lite uses the lighter body model there, as phones do.
      else if (new URLSearchParams(location.search).has("numbers")) {
        document.body.classList.add("numbers");
        watchReader();
      }

      // Counts what the body reader does, from the messages between the page and the reader's own lane (see
      // BrowserReader.jspre): reads a second, how long one takes, and how long after the picture was sent its answer
      // came back. Shown every two seconds with the screen's and the camera's pictures a second.
      function watchReader() {
        var Real = window.Worker, count = { frames: 0, camera: 0, reads: 0, bodyMs: 0, wait: 0, hands: 0, handMs: 0 };
        var sent = [], since = performance.now(), video = null, slowest = 0;
        var asked = new URLSearchParams(location.search), lite = phone ? !asked.has("full") : asked.has("lite");
        window.Worker = function (url, options) {
          if (String(url).indexOf("reader-worker") < 0) return new Real(url, options);
          // The lighter body model (see reader-worker.js); ?full keeps the full one, for comparing.
          var worker = new Real(lite ? url + "?lite" : url, options);
          var post = worker.postMessage;
          worker.postMessage = function (message) {
            if (message && message.kind === "read") sent.push(performance.now());
            return post.apply(worker, arguments);
          };
          worker.addEventListener("message", function (event) {
            if (event.data.kind !== "read" || !sent.length) return;
            var wait = performance.now() - sent.shift();
            if (event.data.bodyRead !== false) {
              count.reads++;
              count.bodyMs += event.data.bodyMs;
              count.wait += wait;
              slowest = Math.max(slowest, wait);
            }
            if (event.data.handsRead) { count.hands++; count.handMs += event.data.handMs; }
          });
          return worker;
        };
        window.Worker.prototype = Real.prototype;
        var hitches = 0, longest = 0, lastFrame = 0;
        var frame = function (at) {
          count.frames++;
          if (lastFrame && at - lastFrame > 50) { hitches++; longest = Math.max(longest, at - lastFrame); }
          lastFrame = at;
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);

        // While trying (2026-10-30), with &log: the same numbers, the screen's hitches and anything that goes wrong also
        // go to the online program's live log (see /api/testlog there), to be read on the Mac while the owner plays.
        var reporting = asked.has("log"), id = Math.random().toString(36).slice(2, 6), lines = [], starts = 1, Log = "https://api.cuzgames.com/api/testlog";
        try { starts = Number(sessionStorage.getItem("otc-starts") || 0) + 1; sessionStorage.setItem("otc-starts", starts); } catch (e) {}
        var log = function (line) { if (reporting) lines.push((performance.now() / 1000).toFixed(1) + "s " + line); };
        var ship = function (last) {
          if (!lines.length) return;
          var body = JSON.stringify({ id: id, lines: lines.splice(0) });
          if (last && navigator.sendBeacon) navigator.sendBeacon(Log, body);
          else fetch(Log, { method: "POST", keepalive: true, headers: { "Content-Type": "text/plain" }, body: body }).catch(function () {});
        };
        log("start " + starts + " in this tab: " + navigator.userAgent + "; screen " + screen.width + "x" + screen.height + " x" +
          window.devicePixelRatio + ", sharpness " + (config.devicePixelRatio || window.devicePixelRatio) + ", " + (lite ? "light" : "full") + " body");
        if (reporting) ["error", "warn", "log"].forEach(function (kind) {
          var real = console[kind];
          console[kind] = function () {
            var text = Array.prototype.map.call(arguments, String).join(" ");
            if (kind !== "log" || text.charAt(0) === "[") log(kind + ": " + text.slice(0, 300));
            return real.apply(console, arguments);
          };
        });
        window.addEventListener("error", function (event) { log("page error: " + event.message); });
        window.addEventListener("unhandledrejection", function (event) { log("unhandled: " + (event.reason && (event.reason.message || event.reason))); });
        document.addEventListener("visibilitychange", function () { log("page " + document.visibilityState); ship(true); });
        window.addEventListener("pagehide", function () { log("page closing"); ship(true); });
        document.addEventListener("fullscreenchange", function () { log("full screen " + (document.fullscreenElement ? "on" : "off")); });
        document.getElementById("unity-canvas").addEventListener("webglcontextlost", function () { log("GRAPHICS LOST"); ship(true); });
        setInterval(function () {
          var reader = window.OTCReader;
          if (reader && reader.video && reader.video !== video && reader.video.requestVideoFrameCallback) {
            video = reader.video;
            var picture = function () { count.camera++; video.requestVideoFrameCallback(picture); };
            video.requestVideoFrameCallback(picture);
          }
          var seconds = (performance.now() - since) / 1000, c = count, size = reader && reader.size();
          var each = function (n) { return Math.round(n / seconds); }, average = function (ms, n) { return n ? Math.round(ms / n) : 0; };
          document.getElementById("numbers").textContent =
            "screen " + each(c.frames) + "/s  camera " + each(c.camera) + "/s" + (size ? " " + size[0] + "x" + size[1] : "") + "\n" +
            "body " + each(c.reads) + "/s  read " + average(c.bodyMs, c.reads) + " ms  answer after " + average(c.wait, c.reads) +
            " ms (slowest " + Math.round(slowest) + ")\n" +
            "hands " + each(c.hands) + "/s  " + average(c.handMs, c.hands) + " ms  " + (lite ? "light" : "full") + " body, on the " + (reader ? reader.processor : "?") +
            "  sharpness " + (config.devicePixelRatio || window.devicePixelRatio);
          var game = window.OTCGame && window.OTCGame.Module;
          log(document.getElementById("numbers").textContent.replace(/\n/g, " | ") + " | hitches " + hitches + " (longest " +
            Math.round(longest) + " ms) | reader " + (reader ? reader.state : "-") + " camera " + (reader ? reader.camera : "-") +
            (game && game.HEAP8 ? " | game memory " + Math.round(game.HEAP8.length / 1048576) + " MB" : ""));
          ship(false);
          count = { frames: 0, camera: 0, reads: 0, bodyMs: 0, wait: 0, hands: 0, handMs: 0 };
          since = performance.now();
          slowest = 0;
          hitches = 0;
          longest = 0;
        }, 2000);
      }

      // On a computer the games play in Chrome and the browsers built on it (Edge, Brave, Arc, Opera), and in Safari
      // (too slow on 2026-10-28, fine with the reader as it is now: owner, 2026-10-30). Phones and tablets play (above).
      // Any other browser gets a card asking for Chrome instead of the game's download. ?anybrowser skips this, for trying others.
      var browser = navigator.userAgentData, safari = /^Apple/.test(navigator.vendor || "");
      var playable = new URLSearchParams(location.search).has("anybrowser") || phone || safari || !!(browser && !browser.mobile &&
        browser.platform !== "Android" && browser.brands.some(function (b) { return b.brand === "Chromium"; }));
      if (!playable) {
        document.querySelector("#loading p").textContent =
          "The games play in Chrome or Safari on a computer. Open this page there to play.";
        document.getElementById("bar").style.display = "none";
        document.getElementById("chrome").style.display = "flex";
        var link = location.origin + location.pathname;
        if ((browser && browser.mobile) || navigator.maxTouchPoints > 1) { // a phone or tablet: send the link to themselves, to open on a computer later
          document.getElementById("get").style.display = "none";
          document.querySelector("#loading p").textContent =
            "The games play on a computer with a camera, in Chrome or Safari. Send yourself the link to play there.";
          document.getElementById("chrome").classList.add("phone");
          OTCShop.step("phone");
          var send = document.getElementById("send"), note = "Off the Couch: games you play with your body. Open on my computer in Chrome:";
          send.style.display = "block";
          send.onclick = function () {
            // The phone's own share menu (email, WhatsApp, notes…); browsers inside apps such as Instagram have none,
            // so there a new email to themselves opens instead. Either way we see nothing of it.
            if (navigator.share) navigator.share({ title: "Off the Couch", text: note, url: link })
              .then(function () { send.textContent = "Sent! Open it on your computer"; }, function () {});
            else location.href = "mailto:?subject=" + encodeURIComponent("Off the Couch: play on my computer") +
              "&body=" + encodeURIComponent(note + "\n" + link);
          };
        }
        document.getElementById("copy").onclick = function () {
          var copy = this;
          navigator.clipboard.writeText(link).then(function () {
            copy.textContent = "Copied: paste it into Chrome";
          }, function () {
            document.querySelector("#loading p").textContent = "Open this address in Google Chrome on a computer: " + link;
          });
        };
      } else {
        orchardStart();
        OTCShop.start(play);
      }

      // Every visit (owner 2026-11-03: the old card with the drawn computer and "Turn on" must never show): the paper
      // orchard over the game while it downloads, fruit flying and being sliced from the first moment, then one button,
      // "Play with your camera", that asks for the camera right away (people say yes far more often to a question that
      // follows their own tap). On a first visit (nothing marked on this device yet, or ?first to try it) the game
      // meanwhile goes straight into Fruit Slicer; after that, to the menu (see Boot and WebPage in the game). The game
      // says when it can be played; then the orchard lifts and they are in it.
      function orchardStart() {
        var forced = new URLSearchParams(location.search).has("first"), seen = false;
        try { seen = localStorage.getItem("otcPlayed") === "1"; } catch (e) {}
        document.body.classList.add("first");
        var page = document.getElementById("orchard"), button = document.getElementById("play"), label = button.querySelector("span");
        var promise = document.getElementById("promise"), tapped = false, allowed = false, ready = false, copying = false;
        var agentNow = navigator.userAgent, app = /musical_ly|bytedance|tiktok|trill/i.test(agentNow) ? "TikTok" : /instagram/i.test(agentNow) ? "Instagram" :
          /fban|fbav|fb_iab/i.test(agentNow) ? "Facebook" : /snapchat/i.test(agentNow) ? "Snapchat" : /; wv\)/.test(agentNow) ? "an app" : "";
        var tell = function (words) { if (window.OTCShop && OTCShop.say) OTCShop.say("page: " + words); };
        window.OTCPage = {
          firstVisit: !seen || forced,
          orchard: true,
          gameReady: function () { ready = true; lift(); }
        };
        setTimeout(function () { page.classList.add("ready"); }, 900);
        flying(page);

        button.onclick = function () {
          if (copying) return copyLink();
          if (tapped) return;
          tapped = true;
          button.disabled = true;
          label.textContent = "Starting the camera...";
          tell("tapped Play with your camera" + (seen && !forced ? " (back again)" : "") + (app ? " inside " + app : ""));
          var media = navigator.mediaDevices, askedAt = Date.now();
          if (!media || !media.getUserMedia) return app ? insideAnApp() : refused("This browser has no camera to give. Try Chrome.");
          media.getUserMedia({ audio: false, video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } })
            .then(function (stream) {
              allowed = true;
              window.OTCEarlyCamera = stream; // the game's camera takes this one (see BrowserReader.jspre)
              var reader = window.OTCReader;
              if (reader && reader.state !== 0 && reader.camera === 0) reader.ask(); // the game was here first
              tell("camera allowed");
              label.textContent = "Getting the fruit ready...";
              lift();
            }, function (error) {
              whyRefused(error, Date.now() - askedAt);
            });
        };

        // Each way the camera can be refused has its own way out, all tried on an Android phone in Chrome (2026-11-04).
        // A question on screen takes seconds to answer; a refusal with no question comes back at once. Tapping away from
        // Chrome's question leaves it asking again, twice; after that, or after "Never allow", Chrome stops asking, with
        // nothing in the address bar on the third, and its site panel is the way back. "Don't allow" on Android's own
        // question for Chrome, twice, leaves that panel with no camera line: only the phone's settings help.
        function whyRefused(error, waited) {
          if (app) return insideAnApp();
          if (!error || error.name !== "NotAllowedError")
            return refused("No camera was found, or another app is using it. Close that app, then tap the button again.");
          var agent = navigator.userAgent;
          if (/iPhone|iPad/.test(agent) || (/Macintosh/.test(agent) && navigator.maxTouchPoints > 1))
            return refused("The camera is blocked. Reload this page, then choose Allow.");
          if (!/Android/.test(agent))
            return refused("The camera is blocked. Click the camera sign in the address bar, choose Allow, then tap the button again.");
          var answer = function (state) {
            if (state === "denied")
              refused("The camera is blocked. Tap the sign left of the web address, tap Permissions, turn on Camera, then reload this page.");
            else if (waited < 1000)
              refused("Your phone is blocking this browser from the camera. In your phone's Settings, open Apps, this browser, Permissions, and allow Camera. Then reload this page.");
            else refused("The camera is off. Tap Try again, then say yes each time your phone asks.");
          };
          if (!navigator.permissions) return answer("");
          navigator.permissions.query({ name: "camera" }).then(function (p) { answer(p.state); }, function () { answer(""); });
        }

        // An app's own browser may keep the camera for itself, and there is no address bar to fix it from. The button
        // now copies the link, with a paid video's mark, so that visit still counts for it.
        function insideAnApp() {
          refused("The camera is blocked in this app. Copy the link and open it in Chrome or Safari.");
          copying = true;
          label.textContent = "Copy the link";
        }
        function copyLink() {
          var from = "", link = location.origin + location.pathname;
          try { from = sessionStorage.getItem("otcFrom") || ""; } catch (e) {}
          if (/^paid-[a-z0-9]+$/.test(from)) link += "?from=" + from;
          var worked = function () { label.textContent = "Copied: paste it in Chrome or Safari"; };
          var failed = function () { promise.querySelector("span").textContent = "Open this address in Chrome or Safari: " + link; };
          var oldWay = function () { // apps' own browsers often refuse the new way
            var box = document.createElement("textarea"), done = false;
            box.value = link;
            box.style.cssText = "position:fixed;opacity:0";
            document.body.appendChild(box);
            box.select();
            try { done = document.execCommand("copy"); } catch (e) {}
            box.remove();
            if (done) worked(); else failed();
          };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(worked, oldWay);
          else oldWay();
        }

        function refused(words) {
          tapped = false;
          button.disabled = false;
          label.textContent = "Try again";
          document.getElementById("note").hidden = true;
          promise.classList.add("problem");
          promise.querySelector("span").textContent = words;
          tell("camera: " + words.split(".")[0].toLowerCase());
        }

        // Into the game once both are true: the camera is allowed and the game can be played.
        function lift() {
          if (!allowed || !ready || page.classList.contains("lifting")) return;
          page.classList.add("lifting");
          try { localStorage.setItem("otcPlayed", "1"); } catch (e) {}
          setTimeout(function () { page.remove(); }, 600);
          document.querySelector("#unity-canvas").focus();
        }
      }

      // The orchard's fruit: thrown up from below every moment, turning as they fly; now and then a gold slash cuts
      // one, which bursts into juice.
      function flying(page) {
        var kinds = { apple: "#E2553F", orange: "#F0AA5A", plum: "#8E6CC0", lemon: "#F2D35B", lime: "#8DBF5A", watermelon: "#F07A6A" };
        var names = Object.keys(kinds), count = 0;
        var throwOne = function () {
          if (!page.isConnected || page.classList.contains("lifting")) return;
          var name = names[Math.floor(Math.random() * names.length)];
          var fruit = document.createElement("img");
          fruit.className = "fruit";
          fruit.alt = "";
          fruit.src = "orchard/" + name + ".webp";
          page.insertBefore(fruit, page.querySelector(".middle"));
          var w = innerWidth, h = innerHeight, from = w * (0.15 + 0.7 * Math.random()), to = from + w * (Math.random() - 0.5) * 0.35;
          var peak = h * (0.2 + 0.25 * Math.random()), turn = (Math.random() < 0.5 ? -1 : 1) * (120 + 200 * Math.random());
          var seconds = 2.6 + Math.random() * 0.8, cut = ++count % 3 === 0;
          var frames = [], steps = 24;
          for (var i = 0; i <= steps; i++) {
            var t = i / steps, x = from + (to - from) * t, y = h + 40 - (h + 40 - peak) * (1 - Math.pow(2 * t - 1, 2));
            frames.push({ transform: "translate(" + x + "px," + y + "px) translate(-50%,-50%) rotate(" + turn * t + "deg)" });
          }
          var flight = fruit.animate(frames, { duration: seconds * 1000, easing: "linear" });
          flight.onfinish = function () { fruit.remove(); };
          if (!cut) return;
          // Cut near the top of its flight, by a slash across it.
          setTimeout(function () {
            if (!fruit.isConnected) return;
            var box = fruit.getBoundingClientRect(), x = box.left + box.width / 2, y = box.top + box.height / 2, side = Math.random() < 0.5 ? -1 : 1;
            var slash = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            slash.setAttribute("class", "slash");
            var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", "M" + (x - side * 220) + " " + (y + 120) + " Q " + x + " " + (y - 30) + " " + (x + side * 220) + " " + (y - 110));
            slash.appendChild(path);
            page.insertBefore(slash, page.querySelector(".middle"));
            var length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.animate([{ strokeDashoffset: length, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, offset: 0.45 }, { strokeDashoffset: -length, opacity: 0 }],
              { duration: 450, easing: "ease-out" }).onfinish = function () { slash.remove(); };
            setTimeout(function () {
              var splat = document.createElement("div");
              splat.className = "splat";
              splat.style.left = x + "px";
              splat.style.top = y + "px";
              splat.style.background = "radial-gradient(circle, " + kinds[name] + " 0 38%, transparent 40%)";
              page.insertBefore(splat, page.querySelector(".middle"));
              setTimeout(function () { splat.remove(); }, 750);
              fruit.remove();
            }, 140);
          }, seconds * 1000 * (0.4 + 0.15 * Math.random()));
        };
        throwOne();
        setTimeout(throwOne, 200);
        setTimeout(throwOne, 450);
        var timer = setInterval(function () {
          if (!page.isConnected) return clearInterval(timer);
          throwOne();
        }, 480);
      }

      // Loads and starts the game: the free download, or the full one (full: where its four files are).
      function play(full) {
        if (full) {
          config.dataUrl = full.data;
          config.frameworkUrl = full.framework;
          config.codeUrl = full.code;
        }
        var loader = document.createElement("script");
        loader.src = full ? full.loader : Files + "327f526aba359949c3ff5273927fa7a2.loader.js";
        loader.onerror = function () {
          if (!full && Files !== "Build/") { // the website's own copy instead
            ["dataUrl", "frameworkUrl", "workerUrl", "codeUrl", "symbolsUrl"].forEach(function (part) {
              if (config[part]) config[part] = config[part].replace(Files, "Build/");
            });
            loader.remove();
            Files = "Build/";
            return play(full);
          }
          document.querySelector("#loading p").textContent = "The games did not download. Check the internet and reload the page.";
          document.body.classList.add("failed");
        };
        loader.onload = function () {
          createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
            bar.style.width = Math.round(100 * progress) + "%";
            document.querySelector("#growing div").style.width = Math.round(100 * progress) + "%";
          }).then(function (game) {
            window.OTCGame = game; // for looking at it from the browser's console (and the phone test's numbers)
            document.getElementById("loading").remove();
            document.querySelector("#unity-canvas").focus(); // keys reach the game without a click first
          }).catch(function (message) {
            // The game's own message is a wall of code; say what to do, and keep what went wrong for the visit's story.
            document.querySelector("#loading p").textContent = "The game did not start. Check your internet, then reload this page.";
            if (window.OTCShop && OTCShop.say) OTCShop.say("game failed: " + String(message).slice(0, 60));
            document.body.classList.add("failed");
          });
        };
        document.body.appendChild(loader);
      }
    </script>
